<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=DM+Mono:wght@400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#08080A;color:#F2EEE6;position:relative;
    font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 72px;
  }
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(242,238,230,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(242,238,230,.06) 1px,transparent 1px);
    background-size:88px 88px;
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 45% 45%,#000 25%,transparent 100%);
  }
  .glow{
    position:absolute;width:1000px;height:1000px;left:38%;top:45%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(216,182,92,.17) 0%,rgba(216,182,92,.05) 34%,transparent 66%);
  }
  .in{position:relative;z-index:2}
  .eyebrow{
    display:flex;align-items:center;gap:16px;
    font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.15em;
    text-transform:uppercase;color:rgba(242,238,230,.42);margin-bottom:36px;
  }
  .eyebrow .mark{color:#D8B65C;display:flex}
  .eyebrow .bar{flex:1;height:1px;background:rgba(242,238,230,.13)}
  h1{
    font-family:'Bodoni Moda',serif;font-weight:400;
    font-size:76px;line-height:1.0;letter-spacing:-.028em;max-width:19ch;
  }
  h1 em{font-style:italic;color:#E9CE8A}
  .foot{
    position:absolute;left:72px;right:72px;bottom:46px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding-top:24px;border-top:1px solid rgba(242,238,230,.13);
    font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.13em;
    text-transform:uppercase;color:rgba(242,238,230,.42);
  }
  .foot b{color:#D8B65C;font-weight:400}
  .wordmark{font-family:'Bodoni Moda',serif;font-size:27px;letter-spacing:-.01em;
            text-transform:none;color:#F2EEE6}
  .wordmark em{font-style:italic;color:#D8B65C}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="in">
    <div class="eyebrow">
      <span class="mark"><svg viewBox="0 0 100 100" width="26" height="26"><path d="M50 20 L76 80 H63.5 L50 47 L36.5 80 H24 Z" fill="currentColor"/></svg></span>
      <span>Web design &amp; local SEO</span>
      <span class="bar"></span>
      <span>Central &amp; North Texas</span>
    </div>
    <h1>The best shop in town shouldn't be the <em>ninth</em> result.</h1>
  </div>
  <div class="foot">
    <span class="wordmark">aedifico<em>.studio</em></span>
    <span>Free visibility audit <b>&rarr;</b></span>
  </div>
</body></html>
